[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-rag-platform"
version = "1.0.0"
description = "Deployable reference RAG service built on the rag-llm-infra package: typed config, structured logging, Prometheus metrics, health/readiness probes, and an index/query API."
readme = "README.md"
# 3.12 is the only version anything here is held to: the image, CI, the badge,
# ruff's target and mypy's python_version all say 3.12, and nothing runs an older
# interpreter, so a wider floor would be a claim no gate stands behind.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Marwa Ben Salem" }]
dependencies = [
  # The supported line: that package's own policy marks 0.1.x unsupported, so
  # staying under 0.2 would pin this service to a line its author does not fix.
  # Capped below 0.3 because 0.x minors promise no compatibility and 0.3 does
  # not exist to test against.
  "rag-llm-infra>=0.2,<0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Non-default backends. The base install ships only the NumPy store + Mock LLM;
# these extras pull the matching flavor of rag-llm-infra so the advertised
# `APP_LLM_BACKEND=openai` / `APP_VECTOR_BACKEND=faiss|qdrant` modes are actually
# installable (`pip install production-rag-platform[openai]`). app.main fails
# fast at startup if a selected backend's package is missing.
openai = ["rag-llm-infra[openai]>=0.2,<0.3"]
faiss = ["rag-llm-infra[faiss]>=0.2,<0.3"]
qdrant = ["rag-llm-infra[qdrant]>=0.2,<0.3"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0", "types-PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/MarwaBS/production-rag-platform"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# Off by default, and a function with no annotation anywhere is then a body
# nothing judges; a waiver that leaves neither a directive nor a decorator.
check_untyped_defs = true

# sentence-transformers is an optional extra the type-check environment does not
# install. Scoped to it alone: rag-llm-infra ships py.typed from 0.2, so every
# call into it is now checked.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The semantic marker covers gates that measure meaning rather than word
# overlap. Deselected by default because a base install cannot satisfy them;
# install the `semantic` extra and select them with `-m semantic`.
addopts = "-ra -m 'not semantic'"
markers = ["semantic: needs a semantic embedder; not satisfiable by the shipped one"]
