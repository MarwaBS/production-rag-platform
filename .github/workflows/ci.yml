name: CI

# This repo is a runnable reference service built on the published rag-llm-infra
# package, plus its deployment infrastructure. CI proves all of it: the service
# installs + its integration tests pass, the image builds, and the IaC validates.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install (pulls rag-llm-infra from PyPI; dev toolchain pinned)
        # constraints-dev.txt pins ruff/mypy/pytest so a tool release can't
        # break main with zero repo changes.
        run: pip install -e ".[dev]" -c constraints-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy app evals scripts tests
      - name: Audit Python dependencies (pip-audit)
        # Trivy scans the built image; this catches a vulnerable pin at PR
        # time, before an image is ever built.
        run: |
          pip install pip-audit -c constraints-dev.txt
          pip-audit
      - name: Integration tests (the run has to account for every test it selects; coverage floor enforced)
        # This step IS the test run. A conftest that marks items skipped leaves
        # them collected and the run green, so the checker starts the run and
        # requires the report it wrote to account for every test in the source.
        run: python -B -m scripts.check_suite_report
      - name: Retrieval eval (recall gate enforced in tests/test_eval.py; print the numbers)
        run: python -m evals

  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: python -m pip install --upgrade pip
      - name: Install with the semantic extra
        run: pip install -e ".[dev,semantic]" -c constraints-dev.txt
      - name: Paraphrase floor + floor-derivation reproduce (semantic-marked gates)
        # This step IS the test run. The checker starts it and reads the report
        # that run wrote, because neither an exit status nor a report handed to
        # a separate step can show which gates actually executed.
        run: python -B -m scripts.check_semantic_report

  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install every optional backend
        run: pip install -e ".[dev,faiss,qdrant,openai]" -c constraints-dev.txt
      - name: Prove the extras landed
        # pip accepts an extra that does not exist without a word, which would
        # leave the gate below on its "names the missing extra" branch.
        run: python -c "import faiss, qdrant_client, openai"
      - name: Every advertised backend constructs
        # Node ids, not `-k`: a selection exits 5 only when nothing matches, so
        # deleting one of two selected gates still exits 0.
        run: |
          python -B -m pytest -q \
            tests/test_app.py::test_every_permitted_backend_starts_or_names_its_missing_extra \
            tests/test_app.py::test_the_backend_settings_expose_the_values_this_file_checks

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Helm lint + render (defaults, then every opt-in template)
        # Rendering defaults alone never reaches the ingress, TLS, ServiceMonitor
        # or PrometheusRule templates, so a broken one ships unrendered.
        run: |
          helm lint deploy/helm
          helm template release deploy/helm > /dev/null
          helm template release deploy/helm \
            --set ingress.enabled=true \
            --set ingress.tls.enabled=true \
            --set ingress.tls.clusterIssuer=letsencrypt-prod \
            --set monitoring.enabled=true \
            --set secrets.data.APP_API_KEY=c2VjcmV0 > /dev/null
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: deploy/Dockerfile
          failure-threshold: warning

  docker:
    runs-on: ubuntu-latest
    needs: [test, semantic, backends, iac]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/marwabs/production-rag-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (load locally for scan + SBOM)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:ci
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        # Pinned to a commit: a tag can be repointed, exact version or not.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Run the built image and exercise its API
        # Everything else reads the image without starting it, so a broken CMD,
        # a missing runtime dependency or a non-executable entrypoint stays
        # green through build, scan and publish.
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE:ci"
          for _ in $(seq 30); do
            if curl -fsS localhost:8000/health > /dev/null; then serving=1; break; fi
            sleep 1
          done
          docker logs smoke
          test -n "${serving:-}"
          curl -fsS -XPOST localhost:8000/index -H 'content-type: application/json' \
            -d '{"documents":["a document the smoke test can retrieve"]}'
          curl -fsS -XPOST localhost:8000/query -H 'content-type: application/json' \
            -d '{"query":"retrieve","k":1}'
          docker rm -f smoke
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:ci
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Check the SBOM inventories the image
        # Generating and uploading a file is not evidence: an SBOM that lists no
        # components is well-formed, uploads, and passes. Reading it back is what
        # makes this step able to fail.
        run: |
          test "$(jq -r '.bomFormat' sbom.cyclonedx.json)" = "CycloneDX"
          components="$(jq '.components | length' sbom.cyclonedx.json)"
          test "$components" -gt 0
          echo "SBOM inventories $components components"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read chart appVersion (the tag a bare `helm install` resolves)
        # The Deployment defaults image.tag to .Chart.AppVersion, so that tag
        # MUST exist on GHCR or a default install ImagePullBackOffs. Deriving it
        # here from the same Chart.yaml keeps CI and the chart in lockstep.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: chart
        run: |
          v="$(awk -F'"' '/^appVersion:/ {print $2}' deploy/helm/Chart.yaml)"
          test -n "$v"  # fail loudly rather than pushing a malformed empty tag
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
      - name: Push the scanned image to GHCR (latest + commit SHA + chart appVersion)
        # Tagged and pushed from the local image the scan and the SBOM read, so
        # the bytes published are the bytes vetted. Building a second time here
        # would publish an artefact nothing in this job ever inspected.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for tag in latest "$GITHUB_SHA" "${{ steps.chart.outputs.app_version }}"; do
            docker tag "$IMAGE:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
