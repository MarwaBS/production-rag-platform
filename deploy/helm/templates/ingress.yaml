{{- if .Values.ingress.enabled }}
{{- /* The prerequisites values.yaml states in prose, enforced: a public
       plaintext or unauthenticated data-plane is refused, not warned about. */}}
{{- if not .Values.ingress.tls.enabled }}
{{- fail "ingress.enabled=true requires ingress.tls.enabled=true: refusing to publish the data-plane over plaintext" }}
{{- end }}
{{- if and .Values.secrets.create (not .Values.secrets.data.APP_API_KEY) }}
{{- fail "ingress.enabled=true requires APP_API_KEY in secrets.data (or secrets.create=false with an out-of-band Secret): refusing to publish an unauthenticated data-plane" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    # ssl-redirect only makes sense WITH a cert to redirect to; tied to tls.enabled
    # so an HTTP->HTTPS redirect is never forced against a host that has no cert.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- with .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- else }}
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
