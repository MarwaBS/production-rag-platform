# Reference defaults; override per environment (image, host, resources).
# `helm lint` + `helm template` validate this chart in CI on every push.
#
# Single replica by design: the index lives in process (app/main.py), so a second
# pod answers /query with 409 until it receives its own /index. Scale-out needs an
# external shared store (docs/decisions/001-faiss-over-managed-vector-db.md), which
# is why this chart ships no HorizontalPodAutoscaler and no PodDisruptionBudget;
# a PDB with minAvailable=1 over one replica would block node drains outright.
replicaCount: 1

image:
  repository: ghcr.io/marwabs/production-rag-platform
  # Tag strategy. CI pushes THREE tags to GHCR on every merge to main:
  #   :latest, :<commit-sha>, and :<appVersion> (from Chart.yaml).
  # Empty tag -> the Deployment falls back to the chart's appVersion, which CI
  # publishes precisely so a bare `helm install` resolves an image that exists.
  # Both :latest and :<appVersion> are MUTABLE (re-stamped on every main merge);
  # production should pin the immutable :<commit-sha>, or better a digest
  # (repository@sha256:...), for reproducible, rollback-safe deploys.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Off by default: this publishes the service to the internet, and the data-plane
# is only authenticated when APP_API_KEY is set. Enable it together with that key
# (via secrets.data) and tls.enabled=true with a real cert.
ingress:
  enabled: false
  className: nginx
  host: rag-platform.example.com
  # Off, because the chart ships no cert, and ssl-redirect is tied to this:
  # forcing it without a cert redirects to a handshake that cannot complete.
  tls:
    enabled: false
    secretName: rag-platform-tls
    clusterIssuer: ""  # e.g. "letsencrypt-prod"; empty omits the annotation

env:
  # Two separate knobs. APP_ENV drives app/config.py; ENV is what rag-llm-infra
  # keys its JSON log formatter on, so the deploy needs both.
  APP_ENV: production
  ENV: prod

# ServiceMonitor + PrometheusRule need the prometheus-operator CRDs, so they
# are opt-in: a bare install on a cluster without those CRDs must not fail.
monitoring:
  enabled: false
  scrapeInterval: 30s

# Credentials reach the pod through a Kubernetes Secret, never through values.
secrets:
  # The app refuses to boot on this chart's APP_ENV=production without
  # APP_API_KEY, so an install needs `--set secrets.data.APP_API_KEY=<base64>`.
  # For real secrets set `create: false` and manage the Secret out of band;
  # otherwise every `helm upgrade` overwrites its data with what is templated here.
  create: true
  # base64-encoded key/values, dev/test only. NEVER commit real secrets here:
  data: {}
